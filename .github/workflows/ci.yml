name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-2025

    steps:
      - name: Read repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Get package.json version
        id: info
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare dependencies
        run: npm i
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build assets
        run: npm run parcel-build

      - name: Build Win32 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.info.outputs.version }}"
          npm exec electron-builder -- --x64 --config.extraMetadata.version="$version" --config.win.artifactName="Twinkle.Tray.v$version.exe" --publish=never

      - name: Upload Win32 installer
        uses: actions/upload-artifact@v7
        with:
          name: twinkle-tray-exe-${{ steps.info.outputs.version }}-${{ github.sha }}
          path: dist/*.exe
