name: Sync upstream

# Two things happen here, in order:
#   1. Merge xanderfrangos/twinkle-tray master into this fork's master.
#   2. Mirror the newest upstream GitHub release as a suffixed fork release.
#
# The release job only runs after a successful sync, and the release workflow
# itself builds the installer. If the merge or the build fails, nothing is
# published.
#
# GITHUB_TOKEN is sufficient: sync-upstream.mjs keeps workflow files identical
# to the fork versions, so the push contains no .github/workflows changes.
# SYNC_TOKEN is still honoured if present, for repos that prefer a PAT.

on:
  schedule:
    # Fork scheduled workflows are disabled after ~60 days of repository
    # inactivity, and scheduled runs can be delayed during busy periods.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
      upstream_version: ${{ steps.sync.outputs.upstream_version }}

    steps:
      - name: Read fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          # GITHUB_TOKEN works because the merge commit never changes the
          # workflow files. SYNC_TOKEN is optional.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        run: node .github/scripts/sync-upstream.mjs
        env:
          UPSTREAM_URL: https://github.com/xanderfrangos/twinkle-tray.git
          FORK_BRANCH: master

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "### Upstream sync needs attention"
            echo ""
            echo "The automatic merge could not be completed. The job log above lists the conflicting files."
            echo "Resolve them locally, commit and push to \`master\`; the next scheduled run will resume automatically."
            echo ""
            echo "Conflicts in \`.github/workflows\`, \`README.md\`, \`package.json\` and \`package-lock.json\` are handled automatically."
          } >> "$GITHUB_STEP_SUMMARY"

  detect-release:
    name: Check for a new upstream release
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      title: ${{ steps.detect.outputs.title }}

    steps:
      - name: Read fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Detect upstream release
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPO: xanderfrangos/twinkle-tray
        run: node .github/scripts/detect-upstream-release.mjs

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Upstream release mirror"
            echo ""
            echo "- Sync changed master: \`${{ needs.sync.outputs.changed }}\`"
            echo "- Upstream package version: \`${{ needs.sync.outputs.upstream_version }}\`"
            echo "- Release needed: \`${{ steps.detect.outputs.should_release }}\`"
            echo "- Fork tag: \`${{ steps.detect.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build mirrored fork release
    needs: [sync, detect-release]
    if: needs.detect-release.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.detect-release.outputs.version }}
      tag: ${{ needs.detect-release.outputs.tag }}
      upstream_tag: ${{ needs.detect-release.outputs.upstream_tag }}
      title: ${{ needs.detect-release.outputs.title }}
      prerelease: ${{ needs.detect-release.outputs.prerelease == 'true' }}
      ref: master
