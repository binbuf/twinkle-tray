name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish installer
    runs-on: windows-2025

    steps:
      - name: Read repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Get package.json version
        id: info
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare dependencies
        run: npm i
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build assets
        run: npm run parcel-build

      - name: Build Win32 installer
        run: npm exec electron-builder -- --x64 --config.extraMetadata.versionBuild="${{ steps.info.outputs.version }}+${{ github.sha }}" --config.win.artifactName="Twinkle.Tray.v${{ steps.info.outputs.version }}.exe" --publish="never"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: twinkle-tray-exe-${{ steps.info.outputs.version }}-${{ github.sha }}
          path: dist/*.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe --title "Twinkle Tray ${{ steps.info.outputs.version }}" --generate-notes